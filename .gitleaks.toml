title = "Spatial Hub secret scanning"

[extend]
useDefault = true

# These public, content-derived SHA-256 identifiers are not access keys.
# Keep every provider-specific detector and all other generic-key matches enabled.
[[allowlists]]
description = "Public catalog selection and evidence digests"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(?:selectionKey|evidenceKey)"\s*:\s*"[a-f0-9]{64}"''']

# Gitleaks splits large minified JSON into fragments, sometimes cutting either
# the digest's field name or value. Limit that fallback to hexadecimal digests
# in the reviewed, public evidence files; other detectors remain enabled.
[[allowlists]]
description = "SHA-256 fragments in reviewed public evidence"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^data/(?:photo-audit-decisions|photo-negative-audit-2026-10-26|zero-point-audit|zero-point-reaudit-2026-10-22|catalog-source-resolution-audit-2026-10-22)\.json\.gz$''']
regexTarget = "match"
regexes = ['''^(?:(?:selection|election|lection|ection|ction|tion|ion|on|n)Key|evidenceKey)"\s*:\s*"[a-f0-9]{16,64}"?$''']

# OAuth client IDs identify public applications. Client secrets are never allowed.
[[allowlists]]
description = "Public Hugging Face OAuth client identifier in historical configuration"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''AUTH_HF_CLIENT_ID"\s*:\s*"[A-Za-z0-9_-]{20,128}"''']

# Minified gzip fragments can start at Key rather than selectionKey. These exact
# public selection digests were independently recomputed from their scene records.
[[allowlists]]
description = "Exact public catalog selection digest at a fragment boundary"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^data/photo-audit-decisions\.json\.gz$''']
regexTarget = "match"
regexes = ['''^Key"\s*:\s*"(?:d1301a8e686cd584a420c2eb6928f47a7a9fd319ba1f18952a7ae536a5a4ed4c|3ddeccf1f7c9b36f6fda7c413e56d0add919ef73a9c9d81b8504a2b0c3cf0b6f)"?$''']
