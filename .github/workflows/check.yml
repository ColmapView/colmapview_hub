name: Check Hub
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: cp .dev.vars.example .dev.vars
      - run: npm run check
      - name: Check manifest compatibility with the released viewer
        uses: actions/checkout@v6
        with:
          repository: ColmapView/Colmapview.github.io
          ref: v0.23.0
          path: .tmp/manifest-viewer
          persist-credentials: false
      - run: npm ci --prefix .tmp/manifest-viewer --ignore-scripts
      - run: npm run catalog:manifests -- --viewer-root .tmp/manifest-viewer
      - run: npx playwright install --with-deps chromium
      - run: npm run test:manifest-runner
        env:
          COLMAPVIEW_AUDIT_VIEWER_ROOT: .tmp/manifest-viewer
      - run: npm run test:browser
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hub-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve manifest validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hub-manifest-validation
          path: .tmp/manifest-audit/plan.json
          if-no-files-found: ignore
          retention-days: 7
