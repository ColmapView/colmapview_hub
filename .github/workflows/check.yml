name: Check Hub
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$RUNNER_TEMP/gitleaks/archive.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks/archive.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks/archive.tar.gz" --directory "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all --full-history" --redact=100 --ignore-gitleaks-allow --max-archive-depth=2 --no-banner --no-color
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: cp .dev.vars.example .dev.vars
      - run: npm run check
      - name: Check manifest compatibility with the minimum v5 viewer
        uses: actions/checkout@v6
        with:
          repository: ColmapView/Colmapview.github.io
          ref: v0.23.0
          path: .tmp/manifest-viewer
          persist-credentials: false
      - run: npm ci --prefix .tmp/manifest-viewer --ignore-scripts
      - run: npm run catalog:manifests -- --viewer-root .tmp/manifest-viewer
      - run: npx playwright install --with-deps chromium
      - run: npm run test:manifest-runner
        env:
          COLMAPVIEW_AUDIT_VIEWER_ROOT: .tmp/manifest-viewer
      - run: npm run test:browser
      - name: Preserve browser failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hub-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve manifest validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hub-manifest-validation
          path: .tmp/manifest-audit/plan.json
          if-no-files-found: ignore
          retention-days: 7
